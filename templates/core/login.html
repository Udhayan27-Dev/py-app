{% extends 'base.html' %}

{% block title %}Log In - PlanMyStudy{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 py-12">
  <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-8 space-y-6">
    <div class="text-center space-y-2">
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h1>
      <p class="text-xs text-slate-500">Sign in to manage and view your saved study timetables.</p>
    </div>

    <form method="post" action="{% url 'login' %}" class="space-y-4">
      {% csrf_token %}
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}

      <div>
        <label for="id_username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Username</label>
        <input type="text"
               name="username"
               id="id_username"
               required
               autocomplete="username"
               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
      </div>

      <div>
        <label for="id_password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password"
               name="password"
               id="id_password"
               required
               autocomplete="current-password"
               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
      </div>

      <div class="pt-2">
        <button type="submit"
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm shadow-md transition-all">
          Sign In
        </button>
      </div>
    </form>

    <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
      Don't have an account yet?
      <a href="{% url 'register' %}" class="font-bold text-indigo-600 hover:text-indigo-800 ml-1">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
