<!-- Floating Chat Widget Container -->
<div id="chat-widget-wrapper" class="relative z-50">
  <!-- Floating Button -->
  <button id="chat-toggle-btn"
          type="button"
          aria-label="Open AI Assistant"
          class="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white shadow-xl flex items-center justify-center transition-all duration-200 transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-indigo-300">
    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
    </svg>
    <span class="absolute -top-1 -right-1 flex h-4 w-4">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
      <span class="relative inline-flex rounded-full h-4 w-4 bg-emerald-500 border-2 border-white"></span>
    </span>
  </button>

  <!-- Chat Window -->
  <div id="chat-widget-container"
       class="hidden fixed bottom-24 right-4 sm:right-6 w-[calc(100vw-2rem)] sm:w-[400px] h-[550px] max-h-[80vh] bg-slate-50 border border-slate-200 rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-fade-in">
    <!-- Header -->
    <div class="bg-indigo-600 text-white px-4 py-3 flex items-center justify-between shadow-sm">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-white text-sm shadow-inner">
          AI
        </div>
        <div>
          <h3 class="font-semibold text-sm leading-tight">PlanMyStudy Assistant</h3>
          <p class="text-[11px] text-indigo-200 flex items-center space-x-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>
            <span>Online • Knowledge Base & Error Help</span>
          </p>
        </div>
      </div>
      <button id="chat-close-btn" type="button" class="text-indigo-200 hover:text-white transition-colors p-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Message History -->
    <div id="chat-messages" class="flex-1 p-4 overflow-y-auto chat-scroll space-y-3 bg-slate-50">
      <!-- Welcome message -->
      <div class="flex flex-col items-start mb-2">
        <div class="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm text-sm leading-relaxed">
          <p class="font-medium text-indigo-900 mb-1">Hi there! 👋</p>
          <p class="text-slate-600">I can answer questions about study schedules, revision techniques, account security, and explain any website error codes.</p>
          
          <div class="mt-3 pt-2 border-t border-slate-100">
            <p class="text-xs text-slate-400 mb-1.5 font-medium">Quick suggestions:</p>
            <div class="flex flex-wrap gap-1.5">
              <button type="button" class="chat-suggestion-pill text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 text-slate-700 px-2.5 py-1 rounded-full transition-colors border border-slate-200" data-prompt="How is the study plan calculated?">
                How is plan calculated?
              </button>
              <button type="button" class="chat-suggestion-pill text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 text-slate-700 px-2.5 py-1 rounded-full transition-colors border border-slate-200" data-prompt="What is the Pomodoro technique?">
                What is Pomodoro?
              </button>
              <button type="button" class="chat-suggestion-pill text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 text-slate-700 px-2.5 py-1 rounded-full transition-colors border border-slate-200" data-prompt="What is error SP-4221?">
                What is SP-4221?
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Input Form -->
    <form id="chat-form" class="p-3 bg-white border-t border-slate-200 flex items-center space-x-2">
      {% csrf_token %}
      <input type="text"
             id="chat-input"
             maxlength="1000"
             placeholder="Ask a question or type an error code..."
             autocomplete="off"
             class="flex-1 bg-slate-100 text-slate-900 placeholder-slate-400 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
      <button type="submit"
              class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-colors shadow-sm"
              title="Send">
        <svg class="w-5 h-5 transform rotate-90" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path>
        </svg>
      </button>
    </form>
  </div>
</div>
