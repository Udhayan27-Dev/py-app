services:
  - type: web
    name: planmystudy-web
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn planmystudy_project.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: DEBUG_ROUTES
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: planmystudy-db
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: "planmystudy_db"
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: planmystudy-db
    plan: free
    region: oregon
    databaseName: planmystudy
    user: planmystudy_user
